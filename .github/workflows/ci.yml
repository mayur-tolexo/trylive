name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U t" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l cmd internal web)" && go vet ./...
      - run: go test -race ./...
        env: { TRYLIVE_TEST_DATABASE_URL: "postgres://t:t@localhost:5432/t?sslmode=disable" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit && npm test -- --run && npm run build
        working-directory: web
