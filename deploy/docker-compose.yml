# Local stack: Postgres plus the server built from this checkout.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trylive
      POSTGRES_PASSWORD: trylive
      POSTGRES_DB: trylive
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trylive"]
      interval: 5s
      timeout: 3s
      retries: 10
  trylive:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://trylive:trylive@db:5432/trylive?sslmode=disable
      ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
